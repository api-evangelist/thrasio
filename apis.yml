aid: thrasio
name: Thrasio
description: 'Thrasio is a consumer products company founded in 2018 and headquartered
  in Walpole, Massachusetts, that acquires and operates e-commerce-native consumer
  brands — principally Amazon marketplace sellers — and then scales them with data
  science, supply-chain and marketing operations. The company states it is one of
  Amazon''s top five sellers, that its products reach more than 80 million households,
  and that it sells across 150+ retailers. Thrasio is a brand aggregator and operator
  rather than a software vendor: it publishes no developer portal, no public API, no
  SDKs and no machine-readable specifications, and its own marketplace integrations
  run over Amazon''s Selling Partner API rather than over any Thrasio-published
  interface.'
